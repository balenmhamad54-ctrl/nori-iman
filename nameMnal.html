<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081c20">
<title>ناوی منداڵان | نووری ئیمان</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#081c20;
 --panel:#102b2b;
 --gold:#e5c477;
 --green:#1c6650;
 --white:#fffdf5;
 --muted:#afc1b9;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
 font-family:'Noto Sans Arabic',sans-serif;
 background:var(--bg);color:var(--white);
 min-height:100vh;overflow-x:hidden
}
button,input,select{font-family:inherit}
.hero{
 position:relative;text-align:center;padding:65px 15px 38px;
 background:radial-gradient(ellipse at top,#235b45,#0b2927 65%,#081c20);
 border-bottom:1px solid #e5c47750;overflow:hidden
}
.hero:before,.hero:after{
 content:"۞";position:absolute;font-size:150px;
 color:#e5c47712;pointer-events:none
}
.hero:before{right:3%;top:-40px}
.hero:after{left:3%;bottom:-65px}
.back{
 position:absolute;right:16px;top:16px;
 color:var(--gold);text-decoration:none;
 background:#ffffff10;border:1px solid #e5c47755;
 padding:9px 15px;border-radius:12px;font-size:12px
}
.logo{
 width:65px;height:65px;border:1px solid var(--gold);
 color:var(--gold);border-radius:22px;
 display:grid;place-items:center;font-size:32px;
 margin:0 auto 14px;transform:rotate(45deg)
}
.logo span{transform:rotate(-45deg)}
.hero h1{font-size:clamp(24px,4vw,36px);color:var(--gold);margin-bottom:8px}
.hero p{font-size:13px;color:var(--muted);line-height:2}
.container{max-width:1200px;margin:auto;padding:25px 18px 55px}
.stats{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:12px;margin-bottom:24px
}
.stat{
 text-align:center;padding:15px 8px;
 border-radius:17px;background:linear-gradient(140deg,#194337,#102a2a);
 border:1px solid #e5c47735
}
.stat strong{display:block;font-size:25px;color:var(--gold)}
.stat span{font-size:12px;color:var(--muted)}
.search{
 position:relative;margin-bottom:18px
}
.search input{
 width:100%;padding:16px 48px 16px 15px;
 border-radius:15px;border:1px solid #d9b96a65;
 outline:none;background:#102b2b;color:white;font-size:14px
}
.search input:focus{border-color:var(--gold);box-shadow:0 0 15px #e5c47718}
.search span{position:absolute;right:16px;top:11px;font-size:22px;color:var(--gold)}
.tabs{
 display:grid;grid-template-columns:repeat(5,1fr);
 gap:9px;margin-bottom:17px
}
.tab{
 padding:12px 5px;border:1px solid #e5c47735;
 border-radius:12px;background:#102b2b;color:#c4d1c9;
 font-size:12px;cursor:pointer;transition:.2s
}
.tab.active,.tab:hover{
 background:linear-gradient(135deg,#e5c477,#b8954c);
 color:#13271f;border-color:var(--gold);font-weight:800
}
.filter-row{
 display:flex;align-items:center;gap:10px;
 flex-wrap:wrap;margin:20px 0
}
.filter-row label{font-size:12px;color:var(--muted)}
.filter-row select{
 background:#102b2b;color:white;border:1px solid #e5c47755;
 border-radius:10px;padding:10px 13px;outline:none
}
.section-head{
 display:flex;justify-content:space-between;
 align-items:center;margin:25px 0 15px;gap:10px
}
.section-head h2{font-size:17px;color:var(--gold)}
.section-head span{font-size:12px;color:var(--muted)}
.grid{
 display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
 gap:14px
}
.card{
 position:relative;overflow:hidden;
 padding:18px 15px;border-radius:18px;
 background:linear-gradient(145deg,#163e35,#102728 80%);
 border:1px solid #d7b86645;
 min-height:170px;transition:.25s
}
.card:nth-child(4n+2){
 background:linear-gradient(145deg,#263d3d,#142a31)
}
.card:nth-child(4n+3){
 background:linear-gradient(145deg,#3a3340,#192a32)
}
.card:nth-child(4n+4){
 background:linear-gradient(145deg,#3d3525,#172c2a)
}
.card:after{
 content:"۞";position:absolute;left:-9px;bottom:-29px;
 font-size:80px;color:#e5c4770d;pointer-events:none
}
.card:hover{
 transform:translateY(-5px);
 border-color:var(--gold);
 box-shadow:0 10px 28px #0004
}
.card-top{
 display:flex;justify-content:space-between;
 align-items:center;margin-bottom:13px
}
.num{font-size:10px;color:#d9c58c99}
.tag{
 font-size:10px;padding:5px 9px;border-radius:20px;
 background:#e5c47719;color:var(--gold)
}
.name{
 color:var(--gold);font-size:28px;
 font-weight:800;margin-bottom:8px;
 position:relative;z-index:1
}
.meaning{
 color:#e3e9e2;font-size:12px;line-height:2;
 position:relative;z-index:1
}
.card-bottom{
 margin-top:12px;padding-top:9px;
 border-top:1px solid #ffffff12;
 color:#a9c2b4;font-size:10px
}
.empty{
 display:none;text-align:center;padding:55px 10px;
 color:var(--muted);line-height:2
}
.empty b{font-size:40px;display:block}
.footer{
 text-align:center;padding:23px;
 border-top:1px solid #ffffff15;
 color:var(--muted);font-size:12px;line-height:2
}
.footer strong{color:var(--gold)}
@media(max-width:900px){
 .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
 .tabs{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:600px){
 .container{padding:18px 12px 40px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .card{padding:14px 11px;min-height:165px}
 .name{font-size:24px}
 .meaning{font-size:11px}
 .stats{gap:7px}
 .stat{padding:12px 5px}
 .stat strong{font-size:21px}
 .stat span{font-size:10px}
 .tabs{grid-template-columns:repeat(2,1fr)}
 .hero{padding-top:70px}
}
@media(max-width:340px){
 .grid{grid-template-columns:1fr}
}
</style>
</head>

<header class="hero">
 <a href="index.html" class="back">↩ گەڕانەوە بۆ سەرەتا</a>
 <div class="logo"><span>۞</span></div>

</header>

 <div class="grid" id="grid"></div>
 <div class="empty" id="empty"><b>🔎</b>هیچ ناوێک نەدۆزرایەوە<br>ناوێکی تر تاقی بکەرەوە</div>
</main>

<footer class="footer">
 <strong>نووری ئیمان ۞</strong>

</footer>

 ["هەورین","پەیوەندیدار بە هەور و ئاسمان","girl","modern"],
 ["پەری","بوونەوەرێکی ئەفسانەیی جوان","girl","modern"],
 ["پەروین","ناوی کۆمەڵە ئەستێرەیەک","girl","modern"],
 ["شەهناز","ناوی جوانی کۆن","girl","modern"],
 ["ئارزوو","هیوا و داخوازی","girl","modern"],
 ["ئارزوو","ئارەزوو و خەون","girl","modern"]
];

let current="all";
const grid=document.getElementById("grid");
const search=document.getElementById("search");
const letter=document.getElementById("letter");

function render(){
 const q=search.value.trim().toLocaleLowerCase();
 const l=letter.value;

 const filtered=names.filter(x=>{
  let category=x[2]+"-"+x[3];
  let categoryOK=current==="all"||category===current;
  let searchOK=x[0].toLocaleLowerCase().includes(q)||
               x[1].toLocaleLowerCase().includes(q);
  let letterOK=l==="all"||x[0].startsWith(l);
  return categoryOK&&searchOK&&letterOK;
 });

 grid.innerHTML="";
 filtered.forEach((x,i)=>{
  const card=document.createElement("article");
  card.className="card";

  const top=document.createElement("div");
  top.className="card-top";

  const number=document.createElement("span");
  number.className="num";
  number.textContent="NO. "+String(i+1).padStart(3,"0");

  const tag=document.createElement("span");
  tag.className="tag";
  tag.textContent=x[3]==="religious"?"ناوی ئاینی":"ناوی مۆدێرن";

  top.append(number,tag);

  const name=document.createElement("div");
  name.className="name";
  name.textContent=x[0];

  const meaning=document.createElement("p");
  meaning.className="meaning";
  meaning.textContent="مانا: "+x[1];

  const bottom=document.createElement("div");
  bottom.className="card-bottom";
  bottom.textContent=x[2]==="boy"?"👦 ناوی کوڕ":"👧 ناوی کچ";

  card.append(top,name,meaning,bottom);
  grid.append(card);
 });

 document.getElementById("count").textContent=filtered.length+" ناو";
 document.getElementById("empty").style.display=filtered.length?"none":"block";
 grid.style.display=filtered.length?"grid":"none";

 const headings={
  all:"هەموو ناوەکان",
  "boy-religious":"ناوە ئاینییەکانی کوڕان",
  "boy-modern":"ناوە مۆدێرنەکانی کوڕان",
  "girl-religious":"ناوە ئاینییەکانی کچان",
  "girl-modern":"ناوە مۆدێرنەکانی کچان"
 };
 document.getElementById("heading").textContent=headings[current];
}

document.querySelectorAll(".tab").forEach(btn=>{
 btn.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  current=btn.dataset.filter;
  render();
 });
});

search.addEventListener("input",render);
letter.addEventListener("change",render);

document.getElementById("total").textContent=names.length;
document.getElementById("boys").textContent=names.filter(x=>x[2]==="boy").length;
document.getElementById("girls").textContent=names.filter(x=>x[2]==="girl").length;

render();
</script>
<script src="./menu.js" defer></script>
</body>
</html>
